[package]
name = "squircle"
version = "0.1.0"
edition = "2024"
description = "Agent-friendly iOS builds, installation links, and diagnostics on your Mac"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
libc = "0.2"
plist = "1.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
ring = "0.17"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
http-body-util = "0.1"
tempfile = "3"
