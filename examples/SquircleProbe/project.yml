name: SquircleProbe
options:
  bundleIdPrefix: ai.dreamslate
  deploymentTarget:
    iOS: "18.0"
packages:
  PLCrashReporter:
    url: https://github.com/microsoft/plcrashreporter.git
    exactVersion: 1.12.2
settings:
  base:
    DEVELOPMENT_TEAM: 2F26US4NAU
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SQUIRCLE_BUILD_ID: ""
targets:
  SquircleProbe:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PLCrashReporter
        product: CrashReporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.dreamslate.SquircleProbe
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Squircle Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SquircleBuildID: $(SQUIRCLE_BUILD_ID)
        NSLocalNetworkUsageDescription: Connect to your Squircle diagnostics server.
  SquircleProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SquircleProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SquircleProbe:
    build:
      targets:
        SquircleProbe: all
        SquircleProbeTests: [test]
    test:
      targets: [SquircleProbeTests]
    archive:
      config: Release
