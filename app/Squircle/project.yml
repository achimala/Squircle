name: Squircle
options:
  bundleIdPrefix: ai.dreamslate
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2F26US4NAU
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 25
    MARKETING_VERSION: 0.3.0
    SQUIRCLE_BUILD_ID: ""
    SQUIRCLE_CLIENT_CONFIG: $(SRCROOT)/../../.squircle/client-t3.json
targets:
  Squircle:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.dreamslate.Squircle
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Squircle.entitlements
    preBuildScripts:
      - name: Bundle private Mac connection
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/client.json"
          mkdir -p "$(dirname "$destination")"
          if [ -f "${SQUIRCLE_CLIENT_CONFIG}" ]; then
            cp "${SQUIRCLE_CLIENT_CONFIG}" "$destination"
            chmod 644 "$destination"
          else
            rm -f "$destination"
          fi
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Squircle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SquircleBuildID: $(SQUIRCLE_BUILD_ID)
        NSLocalNetworkUsageDescription: Connect to your Mac for agent conversations and app builds.
  # Debug overlay the Squircle CLI injects into apps it signs for your phone.
  # It reuses the app's own sources; it is never linked by any app project.
  SquircleOverlay:
    type: framework
    platform: iOS
    sources:
      - path: Sources
        excludes: [SquircleApp.swift]
      - path: Overlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.dreamslate.SquircleOverlay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Squircle Overlay
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: NO
        SWIFT_INSTALL_OBJC_HEADER: NO
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: non-global
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SQUIRCLE_OVERLAY
  SquircleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Squircle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SquircleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Squircle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squircle:
    build:
      targets:
        Squircle: all
        SquircleTests: [test]
        SquircleUITests: [test]
    test:
      targets: [SquircleTests, SquircleUITests]
    archive:
      config: Release
