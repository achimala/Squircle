name: Squircle
options:
  deploymentTarget:
    iOS: "18.0"
# Team, bundle IDs, the shared Keychain group and the embedded connection
# come from Config/Signing.xcconfig and your git-ignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 75
    MARKETING_VERSION: 0.3.0
    SQUIRCLE_BUILD_ID: ""
targets:
  Squircle:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: App
      - path: Shared
      - path: Overlay
        excludes: [OverlayLoader.c]
      - path: Resources/Assets.xcassets
    # Embedding SquircleWidgets (the Live Activity) needs a profile for its
    # own App ID, which automatic signing makes only with an Apple account in
    # Xcode; until then it is built on its own and not embedded. Turn it on:
    #   dependencies:
    #     - target: SquircleWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUIRCLE_APP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Push needs the Push Notifications capability in the profile, which
        # automatic signing adds only with an Apple account in Xcode; until
        # then builds use the wildcard team profile and leave push out.
        # Turn it on: Resources/SquirclePush.entitlements.
        CODE_SIGN_ENTITLEMENTS: Resources/Squircle.entitlements
    preBuildScripts:
      - name: Swift concurrency only (no new Combine or Dispatch)
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/../../scripts/check-swift-concurrency"
      # Only when Config/Local.xcconfig names a connection file: such a build
      # carries your Mac's credentials and is for your own devices.
      - name: Embed private Mac connection (opt-in)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/client.json"
          mkdir -p "$(dirname "$destination")"
          rm -f "$destination"
          [ -n "${SQUIRCLE_EMBED_CONNECTION:-}" ] || exit 0
          if [ ! -f "${SQUIRCLE_EMBED_CONNECTION}" ]; then
            echo "error: SQUIRCLE_EMBED_CONNECTION names ${SQUIRCLE_EMBED_CONNECTION}, which doesn't exist."
            exit 1
          fi
          cp "${SQUIRCLE_EMBED_CONNECTION}" "$destination"
          chmod 644 "$destination"
          echo "warning: this build embeds your private Mac connection; install it only on your own devices."
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Squircle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SquircleBuildID: $(SQUIRCLE_BUILD_ID)
        SquircleAppBundleID: $(SQUIRCLE_APP_BUNDLE_ID)
        SquircleSharedKeychainGroup: $(SQUIRCLE_SHARED_KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Connect to your Mac for agent conversations and app builds.
        NSCameraUsageDescription: Take a photo to send to the coding agent.
        NSSupportsLiveActivities: YES
        NSSupportsLiveActivitiesFrequentUpdates: YES
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [squircle]
  # The Live Activity (Lock Screen and Dynamic Island); the Mac drives it by push.
  SquircleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUIRCLE_APP_BUNDLE_ID).Widgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SKIP_INSTALL: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Squircle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Debug overlay the Squircle CLI injects into apps it signs for your phone.
  # It reuses the app's own sources; it is never linked by any app project.
  SquircleOverlay:
    type: framework
    platform: iOS
    sources:
      - path: Sources
        excludes: [SquircleApp.swift]
      - path: Overlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUIRCLE_BUNDLE_PREFIX).SquircleOverlay
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: NO
        SWIFT_INSTALL_OBJC_HEADER: NO
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: non-global
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SQUIRCLE_OVERLAY
    # The injector reads the shared Keychain group from here, so it always
    # matches what the overlay was compiled with.
    info:
      path: Generated/Overlay-Info.plist
      properties:
        CFBundleDisplayName: Squircle Overlay
        SquircleAppBundleID: $(SQUIRCLE_APP_BUNDLE_ID)
        SquircleSharedKeychainGroup: $(SQUIRCLE_SHARED_KEYCHAIN_GROUP)
  SquircleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Squircle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUIRCLE_APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squircle:
    build:
      targets:
        Squircle: all
        SquircleTests: [test]
    test:
      targets: [SquircleTests]
    archive:
      config: Release
